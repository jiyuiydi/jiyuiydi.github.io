<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold manifesto</title>
<meta name="description" content="Why Fold exists, what the editor is, and where it goes.">
<link rel="stylesheet" href="site.css">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<style>
  .site-header { padding-top: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); max-width: none; }
  .manifesto { max-width: 760px; margin: 0 auto; padding: 40px 24px 96px; }
  .manifesto h1 { font-size: clamp(2rem, 5vw, 3rem); }
  .manifesto h2 { margin-top: 2em; padding-top: .6em; border-top: 1px solid var(--rule); }
  .manifesto h3 { margin-top: 1.6em; font-size: 1.25rem; }
  .manifesto h4 { margin-top: 1.4em; }
  .manifesto :is(h2, h3, h4) { scroll-margin-top: 16px; }
  .manifesto pre { overflow-x: auto; padding: 12px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; font-size: .88rem; line-height: 1.45; }
  .manifesto pre code { font-size: inherit; }
  .manifesto :not(pre) > code { padding: 1px 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; }
  .manifesto .table { overflow-x: auto; margin: 1em 0; }
  .manifesto table { border-collapse: collapse; font-size: .92rem; min-width: 100%; }
  .manifesto th, .manifesto td { padding: 6px 10px; border: 1px solid var(--rule); text-align: left; vertical-align: top; }
  .manifesto th { background: var(--surface); }
  .manifesto blockquote { margin: 1em 0; padding: 0 0 0 16px; border-left: 3px solid var(--rule); color: var(--muted); }
  .manifesto img { max-width: 100%; }
  .manifesto hr { border: none; border-top: 1px solid var(--rule); margin: 2em 0; }
  .status { color: var(--muted); }
</style>
</head>
<body>

<header class="wrap site-header">
  <a class="wordmark" href="./">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h12l6 6v12H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 3v6h6" fill="currentColor" opacity=".35" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    Fold
  </a>
  <nav class="site-nav">
    <a href="./">Home</a>
    <a href="tour.html">Tour</a>
    <a href="MANIFESTO.md">Markdown</a>
  </nav>
</header>

<main class="manifesto" id="manifesto">
  <p class="status">Loading the manifesto…</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
// The manifesto is kept as Markdown (MANIFESTO.md, beside this page) and drawn here.
(async () => {
  const host = document.getElementById('manifesto');
  try {
    const response = await fetch('MANIFESTO.md');
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    host.innerHTML = marked.parse(await response.text());
  } catch (error) {
    host.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'status';
    p.append('The manifesto could not be drawn here. ');
    const a = document.createElement('a');
    a.href = 'MANIFESTO.md';
    a.textContent = 'Read it as Markdown';
    p.append(a, '.');
    host.append(p);
    return;
  }
  // Headings get GitHub-style ids, so sections can be linked to.
  const used = new Map();
  for (const h of host.querySelectorAll('h1, h2, h3, h4')) {
    const base = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s+/g, '-');
    const n = used.get(base) ?? 0;
    used.set(base, n + 1);
    h.id = n === 0 ? base : `${base}-${n}`;
  }
  // Wide tables scroll on their own rather than the page.
  for (const table of host.querySelectorAll('table')) {
    const box = document.createElement('div');
    box.className = 'table';
    table.replaceWith(box);
    box.append(table);
  }
  const title = host.querySelector('h1');
  if (title) document.title = title.textContent.trim();
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
})();
</script>
</body>
</html>
